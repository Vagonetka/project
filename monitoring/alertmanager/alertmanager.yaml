global:
  resolve_timeout: 5m

route:
  receiver: "telegram"
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: "telegram"
    telegram_configs:
      - bot_token: $bot_token
        chat_id: $chat_id
        send_resolved: true
        parse_mode: "HTML"
        message: |
          {{ if eq .Status "firing" }}🔥 <b>[FIRING]</b>{{ else }}✅ <b>[RESOLVED]</b>{{ end }}
          <b>Alert:</b> {{ .CommonLabels.alertname }}
          {{ range .Alerts }}
          <b>Summary:</b> {{ .Annotations.summary }}
          <b>Responsible:</b> {{ .Labels.responsible }}
          {{ end }}