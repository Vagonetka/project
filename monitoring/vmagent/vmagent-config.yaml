global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: 'client-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['client-api:8080']

  - job_name: 'api-tester'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-tester:8081']