
groups:
  - name: api-alerts
    interval: 30s
    rules:
    - alert: Api checker - error
      expr: >-
        api_tester_job_status != 1
      for: 1m
      labels:
        severity: warning
        responsible: Николай Овсянников
      annotations:
        summary: >-
          Ошибка проверки доступности API {{ $labels.product_name }}